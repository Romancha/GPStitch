version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Raise the lower bounds in pyproject.toml along with uv.lock, so they always
    # name the versions CI tested. The default treats gpstitch as a library and
    # touches only the lockfile while the old floor still admits the new release.
    versioning-strategy: increase
    ignore:
      # setuptools 82 removed pkg_resources, which geotiler (gopro-overlay's map
      # widget) imports at module load; pyproject.toml pins setuptools<82 for it.
      - dependency-name: setuptools
        versions: [">=82"]
      # gopro-overlay is pinned exactly because patches/ depends on its
      # internals: updates are done by hand, checking the patches against the
      # new release (0.134.0 broke the render tests in CI, see #35).
      - dependency-name: gopro-overlay
    groups:
      python-minor-patch:
        update-types: [minor, patch]
