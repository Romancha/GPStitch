name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # Fail fast, before tests and build, on the mistakes a manual release invites.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all branches, for the ancestry check

      - name: Check tag, version, branch and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          status=0

          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml"
            status=1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            status=1
          fi
          if ! grep -qE "^## Version ${version//./\\.} " RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md has no '## Version $version' section"
            status=1
          fi

          exit $status

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: verify
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: [verify, ci, e2e]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
